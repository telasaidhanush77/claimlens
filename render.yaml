# Render Blueprint: one free web service. Database = Neon free Postgres with pgvector.
services:
  - type: web
    name: claimlens
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL        # Neon URL, ends with ?sslmode=require
        sync: false
      - key: GEMINI_API_KEY      # optional: without keys only the sample policy works
        sync: false
      - key: GROQ_API_KEY
        sync: false
